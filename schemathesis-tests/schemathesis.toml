seed = 42424242424424242
workers = 1
continue-on-failure = true
request-timeout = 30.0
hooks = "./hooks/hooks.py"
# Tight path/body constraints cause the generator to filter out most candidates
# (tooling limitation, not an API defect).
suppress-health-check = ["filter_too_much"]

[generation]
mode = 'all'
max-examples = 20
# Spring MVC ignores undeclared query/header params. Do not generate extras so
# negative_data_rejection stays meaningful for real schema violations.
allow-extra-parameters = false

[phases.stateful]
enabled = false

[phases.examples]
enabled = true

[phases.coverage]
enabled = true

[phases.fuzzing]
enabled = true

[reports.junit]
path = './output/junit/junit.xml'

[reports.allure]
path = './output/allure/results'

# Suppressing filter_too_much only becomes Unsatisfiable, which Schemathesis still
# reports as Failed Health Check. DELETE path-email ops hit that during fuzzing
# (tight email generation + map_path_parameters hooks). Examples + coverage still
# exercise these endpoints.
[[operations]]
include-path = "/groups/{group_email}"
include-method = "DELETE"
phases.fuzzing.enabled = false

[[operations]]
include-path = "/members/{member_email}"
include-method = "DELETE"
phases.fuzzing.enabled = false
